<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Handstand Fighter</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HS Fighter">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e8e0d0;
    font-family: 'Inter', sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: fixed;
  }

  /* ===== FULLSCREEN CAMERA ===== */
  #game-view {
    position: fixed;
    inset: 0;
    display: none;
  }

  #video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #pose-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* ===== HUD OVERLAYS ===== */
  #hud-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    /* Extra top/side breathing room so the HUD clears the safe zones
       Reels/TikTok/Shorts overlay their own UI into when this footage
       gets shared as a clip. */
    padding: 56px 28px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }

  #hud-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  #session-hud {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    background: rgba(0,0,0,0.65);
    border: 1px solid #c080ff44;
    border-radius: 10px;
    padding: 7px 12px;
    backdrop-filter: blur(6px);
    width: fit-content;
  }

  #session-mode-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #c080ff;
    letter-spacing: 1px;
  }

  #session-value-row {
    display: flex;
    align-items: baseline;
    gap: 7px;
  }

  #session-value {
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 16px #c080ff88;
    line-height: 1;
  }

  #session-unit {
    font-size: 11px;
    color: #888;
  }

  #hud-btn-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #video.mirrored { transform: scaleX(-1); }

  .hud-round-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.65);
    border: 1px solid #ffffff22;
    color: #e8e0d0;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .hud-round-btn:active { transform: scale(0.94); }
  #flip-btn:disabled { opacity: 0.5; }

  #rec-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    height: 34px;
    border-radius: 17px;
    background: rgba(0,0,0,0.65);
    border: 1px solid #ff4444aa;
    color: #ff4444;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    letter-spacing: 0.5px;
  }
  #rec-btn.recording {
    border-color: #ff4444;
    background: rgba(180,0,0,0.5);
    color: #fff;
    animation: rec-pulse 1s ease-in-out infinite;
  }
  @keyframes rec-pulse {
    0%,100% { box-shadow: 0 0 0 0 #ff444400; }
    50%      { box-shadow: 0 0 0 4px #ff444433; }
  }
  #rec-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .lang-toggle {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    gap: 6px;
    z-index: 5;
  }
  .lang-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    background: rgba(255,255,255,0.08);
    color: #888;
    border: 1px solid #ffffff22;
    border-radius: 6px;
    padding: 6px 8px;
    cursor: pointer;
  }
  .lang-btn.active { background: #f0c040; color: #0a0a0f; border-color: #f0c040; }

  #status-pill {
    font-size: 10px;
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    align-self: flex-start;
  }
  .pill-waiting  { background: rgba(40,40,60,0.85); color: #888; border: 1px solid #333; }
  .pill-detecting{ background: rgba(10,40,10,0.85); color: #4caf50; border: 1px solid #4caf5066; }
  .pill-handstand{ background: rgba(60,40,0,0.85);  color: #f0c040; border: 1px solid #f0c04066; }
  .pill-active   { background: rgba(40,0,80,0.85);  color: #c080ff; border: 1px solid #c080ff66; }

  /* ===== HUD BOTTOM ===== */
  #hud-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    /* Extra bottom/side breathing room so the HUD clears the caption
       and like/comment/share column social apps overlay at the bottom
       and right edge of vertical clips. */
    padding: 0 28px 72px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 10;
    pointer-events: none;
  }

  .hud-stat {
    background: rgba(0,0,0,0.65);
    border: 1px solid #ffffff11;
    border-radius: 8px;
    padding: 6px 10px;
    text-align: center;
    backdrop-filter: blur(4px);
  }
  .hud-stat-val {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #c080ff;
    display: block;
  }
  .hud-stat-lbl { font-size: 8px; color: #888; margin-top: 2px; display: block; }

  /* ===== REP/HOLD FLASH ===== */
  #screen-flash {
    position: absolute;
    inset: 0;
    background: #c080ff33;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.12s;
  }

  /* ===== REP POPUP ===== */
  #rep-popup {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translateX(-50%) scale(0);
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 20px #c080ff, 0 2px 0 #000;
    pointer-events: none;
    z-index: 20;
    opacity: 0;
    transition: transform 0.12s, opacity 0.3s;
    white-space: nowrap;
  }
  #rep-popup.pop {
    transform: translateX(-50%) scale(1);
    opacity: 1;
  }

  /* ===== COUNTDOWN ===== */
  #countdown-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  #countdown-overlay.show { display: flex; }

  #countdown-msg {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: #f0c040;
    text-align: center;
    line-height: 1.8;
  }
  #countdown-num {
    font-family: 'Press Start 2P', monospace;
    font-size: 80px;
    color: #fff;
    text-shadow: 0 0 40px #c080ff;
    line-height: 1;
  }
  #countdown-sub {
    font-size: 13px;
    color: #aaa;
    text-align: center;
  }

  /* ===== RESULT OVERLAY ===== */
  #result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    text-align: center;
  }
  #result-overlay.show { display: flex; }

  #result-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    text-align: center;
    line-height: 1.5;
    color: #c080ff;
  }

  #result-value {
    font-family: 'Press Start 2P', monospace;
    font-size: 48px;
    color: #fff;
    text-shadow: 0 0 30px #c080ff;
  }

  #result-record-badge {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: #f0c040;
    text-shadow: 0 0 20px #f0c040;
    display: none;
  }
  #result-record-badge.show { display: block; }

  #result-rankup-badge {
    font-size: 12px;
    color: #c080ff;
    display: none;
  }
  #result-rankup-badge.show { display: flex; align-items: center; gap: 8px; }

  #result-stats {
    background: rgba(255,255,255,0.05);
    border: 1px solid #ffffff22;
    border-radius: 12px;
    padding: 16px 28px;
    display: flex;
    gap: 32px;
  }
  .rs { text-align: center; }
  .rs-val { font-family: 'Press Start 2P', monospace; font-size: 18px; color: #c080ff; display: block; margin-bottom: 4px; }
  .rs-lbl { font-size: 11px; color: #888; }

  #next-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    background: #f0c040;
    color: #0a0a0f;
    border: none;
    padding: 16px 32px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  #next-btn:active { transform: scale(0.96); }

  #app-version {
    position: absolute;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: #555;
  }

  /* ===== TECHNIQUE STOP BUTTON ===== */
  #technique-stop-wrap {
    display: none;
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 0 28px 72px;
    justify-content: center;
    align-items: flex-end;
    z-index: 15;
    pointer-events: none;
  }
  #technique-stop-wrap.show { display: flex; }
  #technique-stop-btn {
    pointer-events: all;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    background: rgba(0,0,0,0.75);
    color: #ff4444;
    border: 2px solid #ff4444;
    border-radius: 12px;
    padding: 14px 40px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    letter-spacing: 1px;
  }
  #technique-stop-btn:active { transform: scale(0.96); }

  /* ===== VIDEO UPLOAD ANALYSIS ===== */
  #upload-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0f;
    z-index: 90;
  }
  #upload-overlay.show { display: block; }
  /* Rendered but invisible: iOS won't decode frames of a display:none video */
  #upload-video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #upload-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #upload-panel {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    padding: 0 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    background: rgba(0,0,0,0.7);
    border-radius: 14px;
    margin: 0 16px;
    padding: 18px 20px;
    backdrop-filter: blur(6px);
  }
  #upload-title { font-family: 'Press Start 2P', monospace; font-size: 11px; color: #c080ff; letter-spacing: 1px; }
  #upload-bar { width: 100%; max-width: 320px; height: 6px; background: #ffffff22; border-radius: 3px; overflow: hidden; }
  #upload-bar-fill { height: 100%; width: 0; background: #c080ff; transition: width 0.2s; }
  #upload-pct { font-family: 'Press Start 2P', monospace; font-size: 14px; color: #fff; }
  #upload-hint { font-size: 12px; color: #999; max-width: 300px; line-height: 1.4; }

  /* ===== TECHNIQUE RESULT ===== */
  #technique-result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px 24px;
    text-align: center;
  }
  #technique-result-overlay.show { display: flex; }
  #tech-res-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: #c080ff;
    letter-spacing: 1px;
  }
  #tech-res-score-wrap {
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  #tech-res-score {
    font-family: 'Press Start 2P', monospace;
    font-size: 64px;
    color: #fff;
    text-shadow: 0 0 30px #c080ff;
  }
  #tech-res-score-pct {
    font-family: 'Press Start 2P', monospace;
    font-size: 24px;
    color: #c080ff;
  }
  #tech-res-score-lbl {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #f0c040;
    letter-spacing: 1px;
  }
  #tech-res-issue-wrap {
    background: rgba(255,255,255,0.05);
    border: 1px solid #ffffff22;
    border-radius: 12px;
    padding: 16px 24px;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #tech-res-issue-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #ff9944;
    letter-spacing: 0.5px;
  }
  #tech-res-tip {
    font-size: 13px;
    color: #ccc;
    line-height: 1.5;
  }
  .result-save-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    background: #4caf50;
    color: #0a0a0f;
    border: none;
    padding: 16px 28px;
    border-radius: 8px;
    cursor: pointer;
  }
  .result-save-btn:disabled { background: #2e4a2f; color: #8fbf91; }
  .result-save-btn:active { transform: scale(0.96); }
  #rec-btn.ready { border-color: #4caf50; color: #4caf50; }

  .result-menu-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    background: transparent;
    color: #aaa;
    border: 1px solid #ffffff33;
    padding: 14px 28px;
    border-radius: 8px;
    cursor: pointer;
  }
  .result-menu-btn:active { transform: scale(0.96); }

  #tech-res-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    background: #c080ff;
    color: #0a0a0f;
    border: none;
    padding: 16px 32px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 4px;
  }
  #tech-res-btn:active { transform: scale(0.96); }

  /* ===== SHARED FULLSCREEN MENU SCREENS ===== */
  .menu-screen {
    position: fixed;
    inset: 0;
    background: #0a0a0f;
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 24px;
    overflow-y: auto;
  }
  .menu-screen.show { display: flex; }

  .screen-logo {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 5vw, 22px);
    color: #f0c040;
    text-shadow: 0 0 30px #f0c04099;
    text-align: center;
    line-height: 1.7;
    margin-bottom: 28px;
    white-space: nowrap;
  }

  .screen-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: #f0c040;
    text-align: center;
    margin-bottom: 24px;
  }

  .big-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    background: #f0c040;
    color: #0a0a0f;
    border: none;
    padding: 18px 36px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 14px;
    width: 100%;
    max-width: 340px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .big-btn:active { transform: scale(0.97); }
  .big-btn.secondary {
    background: transparent;
    color: #e8e0d0;
    border: 1px solid #ffffff33;
  }

  .instr-step {
    width: 100%;
    max-width: 340px;
    background: #0e0e18;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 12px;
  }
  .instr-num {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: #f0c040;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .instr-text { font-size: 13px; color: #ccc; line-height: 1.6; }
  .instr-text b { color: #f0c040; }

  #loading-msg {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #666;
    margin-top: 12px;
    display: none;
    text-align: center;
  }

  /* ===== NICKNAME SCREEN ===== */
  #install-hint {
    position: fixed;
    left: 16px; right: 16px;
    bottom: calc(44px + env(safe-area-inset-bottom, 0px));
    z-index: 250;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #15151f;
    border: 1px solid #f0c04055;
    border-radius: 12px;
    padding: 12px 12px 12px 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  #install-hint[hidden] { display: none; }
  #install-hint-text { flex: 1; font-size: 12px; line-height: 1.45; color: #ddd; }
  #install-hint-text b { color: #f0c040; font-weight: 600; }
  #install-hint-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    background: #f0c040;
    color: #0a0a0f;
    border: none;
    border-radius: 6px;
    padding: 10px 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #install-hint-close {
    background: none;
    border: none;
    color: #777;
    font-size: 16px;
    padding: 4px 6px;
    cursor: pointer;
    flex-shrink: 0;
  }

  #nickname-input, #login-email, #login-code {
    width: 100%;
    max-width: 340px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    background: #14141e;
    border: 1px solid #2a2a3a;
    color: #e8e0d0;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 18px;
    text-align: center;
  }
  #nickname-input:focus, #login-email:focus, #login-code:focus { outline: none; border-color: #f0c040; }
  #login-code { font-family: 'Press Start 2P', monospace; font-size: 20px; letter-spacing: 6px; }
  #login-hint, #login-sent-text, #boot-msg {
    font-size: 13px;
    color: #999;
    text-align: center;
    max-width: 320px;
    line-height: 1.5;
    margin-bottom: 18px;
  }
  #login-sent-text { color: #e8e0d0; }
  #login-error { font-size: 12px; color: #ff7a7a; text-align: center; max-width: 320px; margin-top: 12px; min-height: 1em; }
  #profile-email { font-size: 12px; color: #777; margin-top: -6px; margin-bottom: 14px; }
  #nickname-hint {
    font-size: 12px;
    color: #888;
    text-align: center;
    margin-bottom: 24px;
    max-width: 320px;
    line-height: 1.5;
  }

  /* ===== PROFILE SCREEN ===== */
  #profile-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    color: #c080ff;
    text-align: center;
    margin-bottom: 20px;
    word-break: break-word;
  }

  #rank-card {
    width: 100%;
    max-width: 340px;
    background: rgba(255,255,255,0.05);
    border: 1px solid #ffffff22;
    border-radius: 12px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  #rank-icon { width: 48px; height: 48px; flex-shrink: 0; }
  #rank-icon.legend-glow {
    animation: legend-pulse 1.6s ease-in-out infinite;
  }
  @keyframes legend-pulse {
    0%, 100% { filter: drop-shadow(0 0 6px #c080ff); }
    50%      { filter: drop-shadow(0 0 18px #ff6090) brightness(1.2); }
  }
  #rank-info { flex: 1; min-width: 0; }
  #rank-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: #f0c040;
    margin-bottom: 8px;
  }
  #rank-progress-bg {
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
    height: 10px;
    overflow: hidden;
  }
  #rank-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #c080ff, #ff6090);
    border-radius: 6px;
    transition: width 0.3s ease;
  }
  #rank-progress-text {
    font-size: 10px;
    color: #888;
    margin-top: 6px;
  }

  .profile-section-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #f0c040;
    width: 100%;
    max-width: 340px;
    margin-bottom: 10px;
    margin-top: 6px;
  }

  #profile-badges {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }
  .badge-row {
    display: flex;
    align-items: center;

// ===================== PIXEL ART RENDERER =====================
// Generic renderer for any { grid, palette } pixel-art definition.
// grid: array of equal-length strings, '.' = transparent, any other
// char is a key into palette mapping to a CSS color.
function renderPixelArt(def, size) {
  const grid = def.grid, palette = def.palette;
  const cols = grid[0].length, rows = grid.length;
  const unit = size / cols;
  let rects = '';
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const c = grid[y][x];
      if (c === '.') continue;
      rects += `<rect x="${(x*unit).toFixed(2)}" y="${(y*unit).toFixed(2)}" width="${unit.toFixed(2)}" height="${unit.toFixed(2)}" fill="${palette[c]}"/>`;
    }
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" shape-rendering="crispEdges">${rects}</svg>`;
}

const LEGACY_PROFILE_KEY = 'hf_profile';       // pre-account local progress
const MIGRATED_KEY = 'hf_profile_migrated';
const PROFILE_CACHE_KEY = 'hf_profile_cache';  // offline copy of the signed-in profile
const REF_KEY = 'hf_ref';
const REF_RE = /^[a-z0-9_-]{1,64}$/;

// Read before the Supabase client consumes the URL hash
const authErrorInUrl = new URLSearchParams(location.hash.slice(1)).get('error_code');

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});

let authUser = null;
let profile = null;
let profileSyncPending = false;

function storageGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function storageSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
function storageRemove(key) { try { localStorage.removeItem(key); } catch (e) {} }

// First-touch attribution: the first ?ref= code seen on this device wins
function captureReferral() {
  const params = new URLSearchParams(location.search);
  if (!params.has('ref')) return;
  const code = (params.get('ref') || '').trim().toLowerCase();
  if (REF_RE.test(code) && !storageGet(REF_KEY)) storageSet(REF_KEY, code);
  params.delete('ref');
  const qs = params.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
}

function badgeFromRow(value, at) {
  return value != null && at ? { value, ts: Date.parse(at) } : null;
}

function rowToProfile(row) {
  return {
    nickname: row.nickname || '',
    totalReps: row.total_reps || 0,
    totalHoldSeconds: row.total_hold_seconds || 0,
    bestRepsSession: badgeFromRow(row.best_reps_value, row.best_reps_at),
    bestHoldSession: badgeFromRow(row.best_hold_value, row.best_hold_at),
    hasAccess: !!row.has_access,
    refCode: row.ref_code || null,
  };
}

function profileToRow(p) {
  const iso = b => (b ? new Date(b.ts).toISOString() : null);
  return {
    nickname: p.nickname || null,
    total_reps: p.totalReps,
    total_hold_seconds: p.totalHoldSeconds,
    best_reps_value: p.bestRepsSession ? p.bestRepsSession.value : null,
    best_reps_at: iso(p.bestRepsSession),
    best_hold_value: p.bestHoldSession ? p.bestHoldSession.value : null,
    best_hold_at: iso(p.bestHoldSession),
    updated_at: new Date().toISOString(),
  };
}

function cacheProfile() {
  if (authUser && profile) storageSet(PROFILE_CACHE_KEY, JSON.stringify({ userId: authUser.id, profile }));
}

function readCachedProfile(userId) {
  try {
    const c = JSON.parse(storageGet(PROFILE_CACHE_KEY));
    return c && c.userId === userId ? c.profile : null;
  } catch (e) { return null; }
}

async function pushProfile() {
  if (!authUser || !profile) return false;
  const { error } = await sb.from('profiles').update(profileToRow(profile)).eq('id', authUser.id);
  profileSyncPending = !!error;
  if (error) console.error('Profile sync failed:', error);
  return !error;
}

// Saves locally right away, then syncs to the server; a failed sync retries on the next save or reconnect
function saveProfile() {
  cacheProfile();
  pushProfile();
}
window.addEventListener('online', () => { if (profileSyncPending) pushProfile(); });

async function fetchProfileRow(userId) {
  const { data, error } = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
  if (error) throw error;
  return data;
}

function readLegacyProfile() {
  try {
    const p = JSON.parse(storageGet(LEGACY_PROFILE_KEY));
    if (!p) return null;
    return {
      nickname: p.nickname || '',
      totalReps: p.totalReps || 0,
      totalHoldSeconds: p.totalHoldSeconds || 0,
      bestRepsSession: p.bestRepsSession || null,
      bestHoldSession: p.bestHoldSession || null,
    };
  } catch (e) { return null; }
}

// Prefer the badge that still counts this month, then the higher value
function betterBadge(a, b) {
  if (!a) return b;
  if (!b) return a;
  const aActive = badgeIsActive(a), bActive = badgeIsActive(b);
  if (aActive !== bActive) return aActive ? a : b;
  return b.value > a.value ? b : a;
}

// One-time move of pre-account progress into the first account signed in on this device
async function migrateLegacyProgress() {
  if (storageGet(MIGRATED_KEY)) return;
  const legacy = readLegacyProfile();
  if (!legacy) return;
  profile.totalReps = Math.max(profile.totalReps, legacy.totalReps);
  profile.totalHoldSeconds = Math.max(profile.totalHoldSeconds, legacy.totalHoldSeconds);
  profile.bestRepsSession = betterBadge(profile.bestRepsSession, legacy.bestRepsSession);
  profile.bestHoldSession = betterBadge(profile.bestHoldSession, legacy.bestHoldSession);
  if (!profile.nickname && legacy.nickname) profile.nickname = legacy.nickname.slice(0, 24);
  if (await pushProfile()) storageSet(MIGRATED_KEY, authUser.id);
}

async function onSignedIn(user) {
  authUser = user;
  showOverlayScreen('boot-screen');
  $('boot-msg').textContent = t('bootLoading');
  $('boot-retry-btn').hidden = true;

  let row = null;
  try {
    row = await fetchProfileRow(user.id);
    // The signup trigger creates the row; give it a moment on a brand-new account
    if (!row) { await new Promise(r => setTimeout(r, 800)); row = await fetchProfileRow(user.id); }
  } catch (err) {
    console.error(err);
  }

  if (row) {
    profile = rowToProfile(row);
    await migrateLegacyProgress();
  } else {
    profile = readCachedProfile(user.id);
    if (!profile) {
      $('boot-msg').textContent = t('bootError');
      $('boot-retry-btn').hidden = false;
      return;
    }
  }
  cacheProfile();
  showOverlayScreen(profile.nickname ? 'menu-screen' : 'nickname-screen');
}

function showLoginForm(errorKey) {
  $('login-form').hidden = false;
  $('login-sent').hidden = true;
  $('login-error').textContent = errorKey ? t(errorKey) : '';
  $('login-send-btn').disabled = false;
  $('login-send-btn').textContent = t('loginSend');
  showOverlayScreen('login-screen');
}

async function onLoginSubmit() {
  const email = $('login-email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('login-email').focus(); return; }

  const btn = $('login-send-btn');
  btn.disabled = true;
  btn.textContent = t('loginSending');
  $('login-error').textContent = '';

  const { error } = await sb.auth.signInWithOtp({
    email,
    options: {
      emailRedirectTo: location.origin + location.pathname,
      data: { referred_by: storageGet(REF_KEY) },
    },
  });

  btn.disabled = false;
  btn.textContent = t('loginSend');
  if (error) {
    console.error(error);
    $('login-error').textContent = t(error.status === 429 ? 'loginRateLimited' : 'loginError');
    return;
  }
  pendingEmail = email;
  $('login-form').hidden = true;
  $('login-sent').hidden = false;
  $('login-sent-text').textContent = t('loginSent')(email);
  $('login-code').value = '';
}

// Code entry works where a magic link can't: home-screen apps and in-app browsers keep
// their own storage, so a link opened in Safari would sign in the wrong place.
let pendingEmail = '';
async function onCodeSubmit() {
  const token = $('login-code').value.replace(/\D/g, '');
  if (token.length < 6) { $('login-code').focus(); return; }
  const btn = $('login-code-btn');
  btn.disabled = true;
  $('login-error').textContent = '';
  const { error } = await sb.auth.verifyOtp({ email: pendingEmail, token, type: 'email' });
  btn.disabled = false;
  if (error) {
    console.error(error);
    $('login-error').textContent = t(error.status === 429 ? 'loginRateLimited' : 'loginCodeInvalid');
  }
  // On success onAuthStateChange(SIGNED_IN) takes over
}

const APP_BASE_URL = 'https://errikko.github.io/handstand-fighter/';

function partnerLink(code) { return `${APP_BASE_URL}?ref=${code}`; }

function formatMoney(n) {
  return new Intl.NumberFormat(LANG === 'ru' ? 'ru-RU' : 'en-US', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(n || 0);
}

async function loadPartnerStats() {
  const { data, error } = await sb.rpc('get_my_partner_stats');
  // Hidden until the partner schema exists and returns this user's code
  if (error || !data || !data.ref_code) { $('partner-section').hidden = true; return; }
  if (profile && profile.refCode !== data.ref_code) { profile.refCode = data.ref_code; cacheProfile(); }
  $('partner-section').hidden = false;
  $('partner-desc').textContent = t('partnerDesc');
  // Money is shown only once a partner has actually earned something
  const hasMoney = Number(data.earned) > 0 || Number(data.paid_out) > 0;
  document.querySelectorAll('.partner-money').forEach(el => { el.hidden = !hasMoney; });
  $('partner-link').textContent = partnerLink(data.ref_code);
  $('ps-invited').textContent = data.invited;
  $('ps-paying').textContent = data.paying;
  $('ps-earned').textContent = formatMoney(data.earned);
  $('ps-balance').textContent = formatMoney(Number(data.earned) - Number(data.paid_out));
  $('partner-referrer').hidden = !data.referrer;
  if (data.referrer) $('partner-referrer').textContent = t('partnerReferrer')(data.referrer);
}

async function sharePartnerLink() {
  if (!profile || !profile.refCode) return;
  const url = partnerLink(profile.refCode);
  if (navigator.share) {
    try { await navigator.share({ title: 'Handstand Fighter', text: t('partnerShareText'), url }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(url);
    const btn = $('partner-share-btn');
    btn.textContent = t('partnerCopied');
    setTimeout(() => { btn.textContent = t('partnerShare'); }, 2000);
  } catch (e) {
    // Clipboard blocked: the link text itself is selectable
  }
}

  authUser = null;
  profile = null;
  showLoginForm();
}

// ===================== NAVIGATION =====================
const OVERLAY_SCREENS = ['boot-screen', 'login-screen', 'nickname-screen', 'menu-screen', 'mode-screen', 'instr-screen', 'profile-screen'];

function showOverlayScreen(id) {
  OVERLAY_SCREENS.forEach(s => $(s).classList.remove('show'));
  $(id).classList.add('show');
  updateInstallHint();
}

function hideOverlayScreens() {
  OVERLAY_SCREENS.forEach(s => $(s).classList.remove('show'));
  updateInstallHint();
}

// ===================== INSTALL HINT (PWA) =====================
const INSTALL_DISMISSED_KEY = 'hf_install_hint_dismissed';
const IS_STANDALONE = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(navigator.userAgent);
let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  updateInstallHint();
});
window.addEventListener('appinstalled', () => {
  storageSet(INSTALL_DISMISSED_KEY, '1');
  deferredInstallPrompt = null;
  updateInstallHint();
});

function updateInstallHint() {
  const onEntryScreen = ['login-screen', 'menu-screen'].some(id => $(id).classList.contains('show'));
  const show = (IS_IOS || IS_ANDROID) && !IS_STANDALONE && !storageGet(INSTALL_DISMISSED_KEY) && onEntryScreen;
  $('install-hint').hidden = !show;
  if (!show) return;
  const canPrompt = !!deferredInstallPrompt;
  $('install-hint-text').innerHTML = IS_IOS ? t('installIOS') : canPrompt ? t('installAndroid') : t('installAndroidMenu');
  $('install-hint-btn').hidden = !canPrompt;
}

async function onInstallClick() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice.catch(() => null);
  deferredInstallPrompt = null;
  updateInstallHint();
}

function dismissInstallHint() {
  storageSet(INSTALL_DISMISSED_KEY, '1');
  updateInstallHint();
}

function closeOverlayScreen() {
  hideOverlayScreens();
  if (returnTo === 'game') {
    $('game-view').style.display = 'block';
    gameActive = pausedGameActive;
  } else {
    showOverlayScreen('menu-screen');
  }
}

function openInstructions(from) {
  returnTo = from;
  if (from === 'game') {
    pausedGameActive = gameActive;
    gameActive = false;
    closeIngameMenu();
  }
  showOverlayScreen('instr-screen');
}

function openProfile(from) {
  returnTo = from;
  if (from === 'game') {
    pausedGameActive = gameActive;
    gameActive = false;
    closeIngameMenu();
  }
  renderProfile();
  showOverlayScreen('profile-screen');
}

function badgeIsActive(badge) {
  return badge && (Date.now() - badge.ts) <= THIRTY_DAYS_MS;
}

function renderProfile() {
  $('profile-name').textContent = profile.nickname;
  $('profile-email').textContent = authUser ? authUser.email : '';
  loadPartnerStats();

  const points = profile.totalReps + profile.totalHoldSeconds;
  const rank = getRank(points);
  const next = getNextRank(rank);
  $('rank-icon').innerHTML = renderPixelArt(rank, 48);
  $('rank-icon').className = rank.id === 'legend' ? 'legend-glow' : '';
  $('rank-label').textContent = rankLabel(rank);
  $('rank-progress-bar').style.width = (next ? Math.min(100, (points - rank.min) / (next.min - rank.min) * 100) : 100) + '%';
  $('rank-progress-text').textContent = t('rankProgress')(points, next);

  const badgesEl = $('profile-badges');
  badgesEl.innerHTML = '';
  badgesEl.appendChild(badgeRow(t('badgeReps'), profile.bestRepsSession, t('resultUnitReps')));
  badgesEl.appendChild(badgeRow(t('badgeHold'), profile.bestHoldSession, t('resultUnitHold')));

  const achEl = $('profile-achievements');
  achEl.innerHTML = '';
  REP_MILESTONES.forEach(n => {
    achEl.appendChild(achRow('dumbbell', t('achReps')(n), profile.totalReps >= n));
  });
  HOLD_MILESTONES.forEach(n => {
    achEl.appendChild(achRow('hourglass', t('achHold')(n), profile.totalHoldSeconds >= n));
  });
}

function badgeRow(label, badge, unit) {
  const row = document.createElement('div');
  const active = badgeIsActive(badge);
  row.className = 'badge-row' + (active ? '' : ' empty');
  const value = active ? `${badge.value} ${unit}` : t('badgeEmpty');
  row.innerHTML = `<span class="badge-label">${label}</span><span class="badge-value">${value}</span>`;
  return row;
}

function achRow(iconKey, label, unlocked) {
  const row = document.createElement('div');
  row.className = 'ach-row' + (unlocked ? '' : ' locked');
  const icon = pixelIcon(unlocked ? iconKey : 'lock', 18);
  row.innerHTML = `<span class="ach-icon">${icon}</span><span class="ach-label">${label}</span>`;
  return row;
}

function selectMode(mode) {
  sessionMode = mode;
  techSource = 'live';
  goPlay();
}

function resetSessionCounters() {
  sessionReps = 0;
  sessionHoldSeconds = 0;
  holdConfirmedAt = null;
  isHandstand = false;
  handstandStartTime = null;
  repPhase = 'top';
  techGoodMs = 0;
  techBadMs = 0;
  techLastFrameTs = null;
  techIssueMs = { banana: 0, vertical: 0, shoulders: 0, knees: 0 };
  techCurrentIssue = null;
  const isTech = sessionMode === 'technique';
  sessionValueEl.textContent = '0';
  sessionModeLabelEl.textContent = isTech ? t('sessionLabelTechnique')
    : sessionMode === 'reps' ? t('sessionLabelReps') : t('sessionLabelHold');
  $('session-unit').textContent = sessionMode === 'reps' ? t('sessionUnitReps') : t('sessionUnitHold');
  $('technique-stop-wrap').classList.toggle('show', isTech);
  $('hud-bottom').style.display = isTech ? 'none' : '';
  if (isTech) $('technique-stop-btn').textContent = t('techStopBtn');
  if (!isTech) refreshHudStats();
}

function refreshHudStats() {
  const badge = sessionMode === 'reps' ? profile.bestRepsSession : profile.bestHoldSession;
  $('stat-record').textContent = badgeIsActive(badge) ? badge.value : 0;
  $('stat-record-lbl').textContent = t('statRecord');
  const points = profile.totalReps + profile.totalHoldSeconds;
  $('stat-points').textContent = points;
  $('stat-points-lbl').textContent = t('statPoints');
  $('stat-rank').textContent = rankLabel(getRank(points));
  $('stat-rank-lbl').textContent = t('statRank');
}

function onRep() {
  sessionReps++;
  sessionValueEl.textContent = sessionReps;

  screenFlash.style.opacity = '1';
  setTimeout(() => { screenFlash.style.opacity = '0'; }, 120);
  repPopup.textContent = '+1';
  repPopup.classList.add('pop');
  setTimeout(() => repPopup.classList.remove('pop'), 400);
}

function finalizeSession() {
  gameActive = false;

  const beforePoints = profile.totalReps + profile.totalHoldSeconds;
  const rankBefore = getRank(beforePoints);

  let value;
  if (sessionMode === 'reps') {
    value = sessionReps;
    profile.totalReps += value;
  } else {
    value = Math.round(sessionHoldSeconds);
    profile.totalHoldSeconds += value;
  }

  const badgeKey = sessionMode === 'reps' ? 'bestRepsSession' : 'bestHoldSession';
  const badge = profile[badgeKey];
  const isNewRecord = !badgeIsActive(badge) || value > badge.value;
  if (isNewRecord) profile[badgeKey] = { value, ts: Date.now() };

  saveProfile();

  const afterPoints = profile.totalReps + profile.totalHoldSeconds;
  const rankAfter = getRank(afterPoints);
  const rankedUp = rankAfter.id !== rankBefore.id;

  showResult(value, isNewRecord, rankedUp ? rankAfter : null);
  stopLiveRecording({
    label: sessionMode === 'reps' ? t('sessionLabelReps') : t('sessionLabelHold'),
    big: String(value),
    unit: sessionMode === 'reps' ? t('resultUnitReps') : t('resultUnitHold'),
    sub: isNewRecord ? t('newRecord') : '',
    line: rankedUp ? t('rankUp')(rankLabel(rankAfter)) : '',
  });
}

function showResult(value, isNewRecord, rankedUpTo) {
  resultTitle.textContent = t('resultTitle');
  $('result-value').textContent = value;
  $('res-value-lbl-val').textContent = sessionMode === 'reps' ? t('resultUnitReps') : t('resultUnitHold');

  const recordBadge = $('result-record-badge');
  recordBadge.classList.toggle('show', isNewRecord);
  if (isNewRecord) {
    recordBadge.innerHTML = pixelIcon('star', 16) + t('newRecord');
  }

  const rankupBadge = $('result-rankup-badge');
  if (rankedUpTo) {
    $('result-rankup-icon').innerHTML = renderPixelArt(rankedUpTo, 28);
    $('result-rankup-text').textContent = t('rankUp')(rankLabel(rankedUpTo));
    rankupBadge.classList.add('show');
  } else {
    rankupBadge.classList.remove('show');
  }

  $('next-btn').textContent = t('nextBtn');
  resultOverlay.classList.add('show');
  updateSaveButtons();
}

function goMenuFromResult() {
  stopLiveRecording(null);
  resultOverlay.classList.remove('show');
  $('technique-result-overlay').classList.remove('show');
  gameActive = false;
  $('game-view').style.display = 'none';

// ===================== COUNTDOWN =====================
function startCountdown() {
  countdownOverlay.classList.add('show');
  let n = 5;
  countdownNum.textContent = n;
  const timer = setInterval(() => {
    n--;
    countdownNum.textContent = n;
    if (n <= 0) {
      clearInterval(timer);
      countdownOverlay.classList.remove('show');
      gameActive = true;
      setStatus('waiting');
    }
  }, 1000);
}

// ===================== START =====================
function goPlay() {
  hideOverlayScreens();
  resetSessionCounters();

  if (cameraStarted) {
    // Camera already running — just start a fresh session.
    $('game-view').style.display = 'block';
    startCountdown();
    return;
  }

  $('loading-msg').style.display = 'block';
  showOverlayScreen('instr-screen');
  $('instr-back-btn').style.display = 'none';

  const engineReady = ensurePoseEngine();

  openCamera(cameraFacing)
    .then(() => engineReady)
    .then(() => {
      hideOverlayScreens();
      $('instr-back-btn').style.display = 'block';
      $('loading-msg').style.display = 'none';
      $('game-view').style.display = 'block';
      cameraStarted = true;
      requestAnimationFrame(renderLoop);
      startCountdown();
    })
    .catch(err => {
      $('loading-msg').textContent = t('noCameraAccess');
      console.error(err);
    });
}

// ===================== CAMERA =====================
let cameraFacing = localStorage.getItem('hf_facing') === 'user' ? 'user' : 'environment';
let isMirrored = false;

function openCamera(facing) {
  const tryCamera = (constraints) =>
    navigator.mediaDevices.getUserMedia({ video: constraints, audio: false });
  const quality = { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } };

  return tryCamera({ facingMode: { exact: facing }, ...quality })
    .catch(() => tryCamera({ facingMode: facing, ...quality }))
    .catch(() => tryCamera(quality))
    .then(stream => {
      if (video.srcObject) video.srcObject.getTracks().forEach(tr => tr.stop());
      video.srcObject = stream;
      const settings = stream.getVideoTracks()[0].getSettings();
      isMirrored = (settings.facingMode || facing) === 'user';
      video.classList.toggle('mirrored', isMirrored);
      return new Promise(resolve => { video.onloadedmetadata = resolve; });
    })
    .then(() => video.play());
}

async function switchCamera() {
  const btn = $('flip-btn');
  btn.disabled = true;
  const next = cameraFacing === 'user' ? 'environment' : 'user';
  // iOS allows only one active camera, so release the current one first
  if (video.srcObject) video.srcObject.getTracks().forEach(tr => tr.stop());
  try {
    await openCamera(next);
    cameraFacing = next;
    localStorage.setItem('hf_facing', next);
  } catch (err) {
    console.error(err);
    await openCamera(cameraFacing).catch(console.error);
  }
  latestLm = null;
  lmFilters = null;
  lastVideoTime = -1;
  btn.disabled = false;
}

// ===================== POSE ENGINE (MediaPipe Tasks) =====================
const TASKS_VISION_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const POSE_MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task';
const BODY_CONNECTIONS = [
  [11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],
  [23,25],[25,27],[24,26],[26,28],[27,29],[29,31],[27,31],[28,30],[30,32],[28,32],
  [15,17],[15,19],[15,21],[17,19],[16,18],[16,20],[16,22],[18,20],
];

let poseLandmarker = null; // main-thread fallback
let poseWorker = null;     // preferred: inference off the main thread
let workerBusy = false;
let workerBusySince = 0;
const WORKER_STALL_MS = 1000;
let latestLm = null;     // smoothed landmarks in video pixel space
let lastVideoTime = -1;
let angleLabel = null;   // { value, color } for the reps elbow angle readout

// Shared by the worker and the main-thread fallback (stringified into the worker)
async function createPoseLandmarker(base, model) {
  const { PoseLandmarker, FilesetResolver } = await import(`${base}/vision_bundle.mjs`);
  const fileset = await FilesetResolver.forVisionTasks(`${base}/wasm`);
  const options = delegate => ({
    baseOptions: { modelAssetPath: model, delegate },
    runningMode: 'VIDEO',
    numPoses: 1,
    minPoseDetectionConfidence: 0.6,
    minPosePresenceConfidence: 0.6,
    minTrackingConfidence: 0.6,
  });
  try { return await PoseLandmarker.createFromOptions(fileset, options('GPU')); }
  catch (e) { return await PoseLandmarker.createFromOptions(fileset, options('CPU')); }
}

const POSE_WORKER_SRC = `
${createPoseLandmarker.toString()}
let landmarker = null;
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === 'init') {
    try {
      landmarker = await createPoseLandmarker(m.base, m.model);
      self.postMessage({ type: 'ready' });
    } catch (err) {
      self.postMessage({ type: 'error', message: String(err) });
    }
  } else if (m.type === 'frame') {
    let landmarks = null;
    try {
      const res = landmarker.detectForVideo(m.bitmap, m.ts);
      landmarks = (res.landmarks && res.landmarks[0]) || null;
    } catch (err) {}
    m.bitmap.close();
    self.postMessage({ type: 'result', landmarks });
  }
};`;

function startPoseWorker() {
  return new Promise((resolve, reject) => {
    if (typeof Worker === 'undefined' || typeof createImageBitmap === 'undefined') return reject(new Error('no worker support'));
    const url = URL.createObjectURL(new Blob([POSE_WORKER_SRC], { type: 'text/javascript' }));
    const worker = new Worker(url);
    const timeout = setTimeout(() => { worker.terminate(); reject(new Error('worker init timeout')); }, 45000);
    worker.onerror = err => { clearTimeout(timeout); worker.terminate(); reject(err); };
    worker.onmessage = e => {
      if (e.data.type === 'ready') { clearTimeout(timeout); resolve(worker); }
      if (e.data.type === 'error') { clearTimeout(timeout); worker.terminate(); reject(new Error(e.data.message)); }
    };
    worker.postMessage({ type: 'init', base: TASKS_VISION_URL, model: POSE_MODEL_URL });
  });
}

let engineReadyPromise = null;
function ensurePoseEngine() {
  if (!engineReadyPromise) engineReadyPromise = initPoseEngine();
  return engineReadyPromise;
}

let detectResolver = null;
// One-off detection on an arbitrary frame source (used by video upload analysis)
async function detectOnce(src) {
  if (poseWorker) {
    while (workerBusy && performance.now() - workerBusySince < WORKER_STALL_MS) await new Promise(r => setTimeout(r, 10));
    workerBusy = true;
    workerBusySince = performance.now();
    let bitmap;
    try { bitmap = await createImageBitmap(src); }
    catch (err) { workerBusy = false; throw err; }
    return new Promise(resolve => {
      detectResolver = resolve;
      poseWorker.postMessage({ type: 'frame', bitmap, ts: performance.now() }, [bitmap]);
    });
  }
  const res = poseLandmarker.detectForVideo(src, performance.now());
  return (res.landmarks && res.landmarks[0]) || null;
}

async function initPoseEngine() {
  try {
    poseWorker = await startPoseWorker();
    poseWorker.onmessage = e => {
      if (e.data.type !== 'result') return;
      workerBusy = false;
      if (detectResolver) { const resolve = detectResolver; detectResolver = null; resolve(e.data.landmarks); return; }
      handleLandmarks(e.data.landmarks);
    };
  } catch (err) {
    console.warn('Pose worker unavailable, using main thread:', err);
    poseWorker = null;
    poseLandmarker = await createPoseLandmarker(TASKS_VISION_URL, POSE_MODEL_URL);
  }
}

function handleLandmarks(raw) {
  if (raw) {
    latestLm = smoothLandmarks(raw, video.videoWidth, video.videoHeight, performance.now() / 1000);
  } else {
    latestLm = null;
    lmFilters = null;
  }
  processPose(latestLm);
}

function requestDetection() {
  if (poseWorker) {
    // A frame lost mid-flight (e.g. while switching cameras) must not stall tracking forever
    if (workerBusy && performance.now() - workerBusySince < WORKER_STALL_MS) return;
    workerBusy = true;
    workerBusySince = performance.now();
    lastVideoTime = video.currentTime;
    createImageBitmap(video)
      .then(bitmap => poseWorker.postMessage({ type: 'frame', bitmap, ts: performance.now() }, [bitmap]))
      .catch(() => { workerBusy = false; });
  } else {
    lastVideoTime = video.currentTime;
    const res = poseLandmarker.detectForVideo(video, performance.now());
    handleLandmarks(res.landmarks && res.landmarks[0]);
  }
}

// One Euro filter: smooths jitter when still, stays responsive when moving fast
function oneEuroAlpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
class OneEuro {
  constructor(minCutoff, beta) { this.minCutoff = minCutoff; this.beta = beta; this.x = null; this.dx = 0; this.t = 0; }
  filter(x, t) {
    if (this.x === null) { this.x = x; this.t = t; return x; }
    const dt = Math.max(1e-3, t - this.t);
    this.t = t;
    this.dx += oneEuroAlpha(1, dt) * ((x - this.x) / dt - this.dx);
    this.x += oneEuroAlpha(this.minCutoff + this.beta * Math.abs(this.dx), dt) * (x - this.x);
    return this.x;
  }
}
let lmFilters = null;
function smoothLandmarks(raw, vw, vh, tSec) {
  if (!lmFilters) lmFilters = raw.map(() => ({ x: new OneEuro(1, 0.007), y: new OneEuro(1, 0.007) }));
  return raw.map((p, i) => ({
    x: lmFilters[i].x.filter(p.x * vw, tSec),
    y: lmFilters[i].y.filter(p.y * vh, tSec),
    visibility: p.visibility ?? 1,
  }));
}

function renderLoop() {
  const cw = window.innerWidth, ch = window.innerHeight;
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }

  if (!uploadActive && video.readyState >= 2 && video.currentTime !== lastVideoTime) requestDetection();

  drawOverlay(latestLm);
  drawRecFrame(video);
  requestAnimationFrame(renderLoop);
}

// Maps video pixel coords to screen coords, matching the <video> object-fit: cover crop
function coverTransform() {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(canvas.width / vw, canvas.height / vh);
  return { s, dx: (canvas.width - vw * s) / 2, dy: (canvas.height - vh * s) / 2 };
}

function drawSkeleton(c, lm, px, py, k = 1) {
  c.strokeStyle = '#c080ff55';
  c.lineWidth = 3 * k;
  c.beginPath();
  for (const [a, b] of BODY_CONNECTIONS) { c.moveTo(px(a), py(a)); c.lineTo(px(b), py(b)); }
  c.stroke();

  c.fillStyle = '#c080ff';
  for (let i = 11; i < lm.length; i++) {
    c.beginPath();
    c.arc(px(i), py(i), 4 * k, 0, Math.PI * 2);
    c.fill();
  }
}

function drawOverlay(lm) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!lm) return;

  const { s, dx, dy } = coverTransform();
  const px = i => { const x = lm[i].x * s + dx; return isMirrored ? canvas.width - x : x; };
  const py = i => lm[i].y * s + dy;

  drawSkeleton(ctx, lm, px, py);

  if (angleLabel) {
    ctx.font = 'bold 20px Inter';
    ctx.fillStyle = angleLabel.color;
    ctx.fillText(angleLabel.value + '°', px(13) + 8, py(13));
  }
}

// ===================== POSE DETECTION =====================
function angle3(a, b, c) {
  const ab = { x: a.x - b.x, y: a.y - b.y };
  const cb = { x: c.x - b.x, y: c.y - b.y };
  const dot = ab.x*cb.x + ab.y*cb.y;
  const mag = Math.sqrt((ab.x**2+ab.y**2)*(cb.x**2+cb.y**2));
  if (!mag) return 180;
  return Math.acos(Math.min(1,Math.max(-1,dot/mag))) * 180/Math.PI;
}

// Key body landmarks (shoulders, hips, ankles, wrists) must be visible
function isBodyVisible(lm) {
  const vis = i => (lm[i] ? lm[i].visibility ?? 1 : 0);
  return [[11, 12], [23, 24], [27, 28], [15, 16]].every(([a, b]) => Math.max(vis(a), vis(b)) > 0.4);
}

function isInverted(lm) {
  const avgY = (a, b) => (lm[a].y + lm[b].y) / 2;
  return avgY(27, 28) < avgY(11, 12) && avgY(15, 16) > avgY(23, 24);
}

// lm: smoothed landmarks in video pixel space (keeps angles/ratios undistorted)
function processPose(lm) {
  angleLabel = null;

  if (!lm) {
    if (gameActive) setStatus('waiting');
    return;
  }

  if (!isBodyVisible(lm)) {
    if (gameActive) setStatus('waiting');
    return;
  }

  setStatus('detecting');

  if (!gameActive) return;

  const lShoulder = lm[11], rShoulder = lm[12];
  const lElbow = lm[13], rElbow = lm[14];
  const lWrist = lm[15], rWrist = lm[16];

  const inverted = isInverted(lm);

  if (inverted) {
    if (!handstandStartTime) handstandStartTime = Date.now();
    if (Date.now() - handstandStartTime > HANDSTAND_CONFIRM_MS) {
      if (!isHandstand) holdConfirmedAt = Date.now();
      isHandstand = true;
      if (sessionMode !== 'technique') setStatus('active');
    } else {
      setStatus('handstand');
    }
  } else {
    if (isHandstand && sessionMode !== 'technique') { finalizeSession(); return; }
    isHandstand = false;
    handstandStartTime = null;
    if (sessionMode === 'technique') techLastFrameTs = null;
    setStatus('detecting');
  }

  if (isHandstand && sessionMode === 'hold') {
    sessionHoldSeconds = (Date.now() - holdConfirmedAt) / 1000;
    sessionValueEl.textContent = Math.floor(sessionHoldSeconds);
  }

  if (isHandstand && sessionMode === 'technique') {
    const now = Date.now();
    // Cap the step so a tracking dropout isn't credited to the next frame in one lump
    const dt = techLastFrameTs ? Math.min(now - techLastFrameTs, TECH_MAX_STEP_MS) : 0;
    techLastFrameTs = now;

    const form = techAccumulate(lm, dt);
    if (form.isGood) setStatus('techGood');
    else setStatus('techBad', form.mainIssue);

    sessionValueEl.textContent = Math.floor((techGoodMs + techBadMs) / 1000);
  }

  if (isHandstand && sessionMode === 'reps') {
    const ea = Math.min(
      angle3(lShoulder, lElbow, lWrist),
      angle3(rShoulder, rElbow, rWrist)
    );

    if (repPhase === 'top' && ea < REP_DOWN)  repPhase = 'bottom';
    if (repPhase === 'bottom' && ea > REP_UP) { repPhase = 'top'; onRep(); }

    angleLabel = { value: Math.round(ea), color: ea < REP_DOWN ? '#c080ff' : '#f0c040' };
  }
}

// ===================== TECHNIQUE MODE =====================
const TECH_MAX_STEP_MS = 200;

function techAccumulate(lm, dt) {
  const form = analyzeForm(lm);
  techCurrentIssue = form.mainIssue;
  if (form.isGood) {
    techGoodMs += dt;
  } else {
    techBadMs += dt;
    if (form.mainIssue) techIssueMs[form.mainIssue] = (techIssueMs[form.mainIssue] || 0) + dt;
  }
  return form;
}

function analyzeForm(lm) {
  // In profile the left/right halves overlap and the far side is noisy; averaging both is steadier
  const mid = (a, b) => ({ x: (lm[a].x + lm[b].x) / 2, y: (lm[a].y + lm[b].y) / 2 });
  const s = { shoulder: mid(11, 12), hip: mid(23, 24), knee: mid(25, 26), ankle: mid(27, 28), wrist: mid(15, 16) };

  // Vector from wrist to ankle (body axis)
  const bx = s.ankle.x - s.wrist.x, by = s.ankle.y - s.wrist.y;
  const blen = Math.sqrt(bx*bx + by*by) || 0.001;

  // 1. VERTICAL: angle of body axis from vertical (degrees)
  const verticalAngle = Math.abs(Math.asin(Math.min(1, Math.abs(bx) / blen)) * 180 / Math.PI);

  // 2. BANANA: perpendicular distance of hip from wrist→ankle line, as % of body length
  const tp = ((s.hip.x - s.wrist.x)*bx + (s.hip.y - s.wrist.y)*by) / (blen*blen);
  const cx = s.wrist.x + tp*bx, cy = s.wrist.y + tp*by;
  const hipDev = Math.sqrt((s.hip.x-cx)**2 + (s.hip.y-cy)**2) / blen * 100;

  // 3. SHOULDERS: horizontal offset of shoulder from wrist, as % of body length
  const shoulderDev = Math.abs(s.shoulder.x - s.wrist.x) / blen * 100;

  // 4. KNEES: angle at knee joint
  const kneeAngle = angle3(s.hip, s.knee, s.ankle);

  // Collect issues sorted by severity
  const issues = [];
  if (hipDev > 10)          issues.push({ id: 'banana',    sev: hipDev });
  if (verticalAngle > 20)   issues.push({ id: 'vertical',  sev: verticalAngle });
  // Shoulders travel past the wrists during a push-up, so only judge them on straight arms
  const elbowAngle = angle3(s.shoulder, mid(13, 14), s.wrist);
  if (elbowAngle > 150 && shoulderDev > 12) issues.push({ id: 'shoulders', sev: shoulderDev });
  if (kneeAngle < 165)      issues.push({ id: 'knees',     sev: 165 - kneeAngle });
  issues.sort((a, b) => b.sev - a.sev);

  return { isGood: issues.length === 0, mainIssue: issues[0]?.id || null };
}

    $('tech-res-score-lbl').textContent = '';
    $('tech-res-issue-label').textContent = '';

    $('tech-res-btn').textContent = t('techResAgain');

  }

  const pct = Math.round(techGoodMs / totalMs * 100);
  $('tech-res-score').textContent = pct;
  $('tech-res-score-pct').textContent = '%';
  $('tech-res-score-lbl').textContent = t('techResGrade')(pct);

  // Find the issue that took the most time
  const topIssue = Object.entries(techIssueMs).sort((a,b) => b[1]-a[1]).find(([,ms]) => ms > 500)?.[0] || null;

  card.big = pct + '%';
  card.sub = t('techResGrade')(pct);
  if (pct >= 80 || !topIssue) {
    $('tech-res-issue-label').textContent = '';
    $('tech-res-tip').textContent = t('techResPerfect');

    $('tech-res-issue-label').textContent = t('techResMainIssue')(t('techIssues')[topIssue]);
    $('tech-res-tip').textContent = t('techTips')[topIssue];
    card.line = t('techResMainIssue')(t('techIssues')[topIssue]);
  }
  $('tech-res-btn').textContent = t('techResAgain');
  return card;
}

// ===================== VIDEO UPLOAD ANALYSIS =====================
const UPLOAD_STEP_S = 1 / 15;
let uploadActive = false;
let uploadCancelled = false;

function resetTechTotals() {
  techGoodMs = 0;
  techBadMs = 0;
  techLastFrameTs = null;
  techIssueMs = { banana: 0, vertical: 0, shoulders: 0, knees: 0 };
  techCurrentIssue = null;
}

function setUploadProgress(frac) {
  const pct = Math.min(100, Math.round(frac * 100));
  $('upload-bar-fill').style.width = pct + '%';
  $('upload-pct').textContent = pct + '%';
}

function cancelUpload() { uploadCancelled = true; }

// Resolves once the frame at t is decoded; time-boxed so a missing iOS event can't hang analysis
function seekTo(v, t) {
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    const timer = setTimeout(finish, 1500);
    v.onseeked = () => {
      v.onseeked = null;
      clearTimeout(timer);
      if (v.requestVideoFrameCallback) {
        v.requestVideoFrameCallback(finish);
        setTimeout(finish, 250);
      } else {
        finish();
      }
    };
    v.currentTime = t;
  });
}

function drawUploadFrame(v, lm) {
  const c = $('upload-canvas'), cx = c.getContext('2d');
  const cw = window.innerWidth, ch = window.innerHeight;
  if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch; }
  const s = Math.min(cw / v.videoWidth, ch / v.videoHeight);
  const dx = (cw - v.videoWidth * s) / 2, dy = (ch - v.videoHeight * s) / 2;
  cx.clearRect(0, 0, cw, ch);
  cx.drawImage(v, dx, dy, v.videoWidth * s, v.videoHeight * s);
  if (lm) drawSkeleton(cx, lm, i => lm[i].x * s + dx, i => lm[i].y * s + dy);
}

const MAX_UPLOAD_S = 90;

function setUploadStage(titleKey) { $('upload-title').textContent = t(titleKey); }

// Pass 1: step through the clip, run tracking + form analysis, keep a per-sample timeline
async function analyzeUploadedVideo(uv) {
  const dur = uv.duration;
  const samples = [];
  let invertedSince = null;
  let stanceMs = 0;
  lmFilters = null;

  for (let i = 0; i * UPLOAD_STEP_S < dur && !uploadCancelled; i++) {
    const t = i * UPLOAD_STEP_S;
    await seekTo(uv, Math.max(t, 0.001));
    const raw = await detectOnce(uv);
    let lm = null;
    if (raw) lm = smoothLandmarks(raw, uv.videoWidth, uv.videoHeight, t);
    else lmFilters = null;
    drawUploadFrame(uv, lm);

    const sample = { t, lm, visible: false, inStance: false, good: false, issue: null, stanceMs };
    if (lm && isBodyVisible(lm)) {
      sample.visible = true;
      if (isInverted(lm)) {
        if (invertedSince === null) invertedSince = t;
        if (t - invertedSince >= HANDSTAND_CONFIRM_MS / 1000) {
          const form = techAccumulate(lm, UPLOAD_STEP_S * 1000);
          stanceMs += UPLOAD_STEP_S * 1000;
          Object.assign(sample, { inStance: true, good: form.isGood, issue: form.mainIssue, stanceMs });
        }
      } else {
        invertedSince = null;
      }
    } else {
      invertedSince = null;
    }
    samples.push(sample);
    setUploadProgress((t / dur) * 0.5);
  }
  return samples;
}

function lerpLandmarks(a, b, f) {
  if (!a || !b) return a || b;
  return a.map((p, i) => ({ x: p.x + (b[i].x - p.x) * f, y: p.y + (b[i].y - p.y) * f, visibility: p.visibility }));
}

function sampleAt(samples, t) {
  const pos = Math.min(Math.max(t / UPLOAD_STEP_S, 0), samples.length - 1);
  const i0 = Math.floor(pos), i1 = Math.min(i0 + 1, samples.length - 1);
  const s0 = samples[i0];
  return { ...s0, lm: lerpLandmarks(s0.lm, samples[i1].lm, pos - i0) };
}

function uploadHudData(smp) {
  let pill;
  if (smp.inStance) pill = smp.good ? { text: t('statusTechGood'), cls: 'pill-detecting' }
    : { text: t('statusTechBad')(t('techIssues')[smp.issue] || ''), cls: 'pill-handstand' };
  else if (smp.visible) pill = { text: t('statusDetecting'), cls: 'pill-detecting' };
  else pill = { text: t('statusWaiting'), cls: 'pill-waiting' };
  return {
    label: t('sessionLabelTechnique'),
    value: String(Math.floor(smp.stanceMs / 1000)),
    unit: t('sessionUnitHold'),
    pill,
    stats: null,
  };
}

function previewRecCanvas() {
  const c = $('upload-canvas'), cx = c.getContext('2d');
  const cw = window.innerWidth, ch = window.innerHeight;
  if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch; }
  const s = Math.min(cw / recCanvas.width, ch / recCanvas.height);
  cx.clearRect(0, 0, cw, ch);
  cx.drawImage(recCanvas, (cw - recCanvas.width * s) / 2, (ch - recCanvas.height * s) / 2, recCanvas.width * s, recCanvas.height * s);
}

// Pass 2: play the clip in real time and record it with the skeleton, HUD and a closing result card
function renderUploadedVideo(uv, samples, card) {
  return new Promise((resolve, reject) => {
    // Fixed iPhone-width layout so the exported clip looks the same from any device
    const k = recCanvas.width / 390;
    const dur = uv.duration;
    let finished = false, interrupted = false, cardStart = null, lastTime = -1, stuckSince = performance.now();

    const rec = createRecorder(file => { if (!interrupted) resolve(uploadCancelled ? null : file); });

    const drawVideoFrame = () => {
      drawVideoCover(recCtx, uv, false);
      dimRec();
      const smp = sampleAt(samples, uv.currentTime);
      if (smp.lm) drawSkeletonOnRec(smp.lm, uv.videoWidth, uv.videoHeight, false, k, false);
      drawHud(recCtx, uploadHudData(smp), k);
    };

    const tick = () => {
      if (finished) return;
      if (uploadCancelled) { finished = true; uv.pause(); rec.stop(); return; }
      // Leaving the app pauses playback; abort rather than export a truncated clip
      if (document.hidden) {
        finished = true; interrupted = true; uv.pause(); rec.stop();
        reject(new Error('interrupted'));
        return;
      }
      if (cardStart === null) {
        drawVideoFrame();
        if (uv.currentTime !== lastTime) { lastTime = uv.currentTime; stuckSince = performance.now(); }
        setUploadProgress(0.5 + Math.min(uv.currentTime / dur, 1) * 0.5);
        // Playback ended, or stalled for 3s: move on to the result card
        if (uv.ended || performance.now() - stuckSince > 3000) { uv.pause(); cardStart = performance.now(); }
      } else {
        drawVideoCover(recCtx, uv, false);
        dimRec();
        const elapsed = performance.now() - cardStart;
        drawResultCard(recCtx, card, Math.min(1, elapsed / 300));
        if (elapsed >= REC_CARD_MS) { finished = true; rec.stop(); return; }
      }
      previewRecCanvas();
      // A timer rather than requestAnimationFrame: rAF stops when the page isn't painted
      setTimeout(tick, 1000 / 30);
    };

    seekTo(uv, 0.001).then(() => {
      drawVideoFrame();
      rec.start(1000);
      let started = false;
      const start = () => { if (!started) { started = true; stuckSince = performance.now(); tick(); } };
      uv.play().then(start).catch(err => {
        if (!finished) { finished = true; rec.stop(); }
        reject(err);
      });
      // play() can stay pending in the background; the stall watchdog takes over from here
      setTimeout(start, 3000);
    });
  });
}

async function onVideoPicked(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;

  const uv = $('upload-video');
  const url = URL.createObjectURL(file);
  hideOverlayScreens();
  $('upload-overlay').classList.add('show');
  setUploadStage('uploadAnalyzing');
  setUploadProgress(0);
  sessionMode = 'technique';
  techSource = 'upload';
  resetTechTotals();
  lastVideo = null;
  uploadCancelled = false;
  uploadActive = true;

  let wakeLock = null;
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}

  let errorKey = null;
  let card = null;
  try {
    uv.src = url;
    await new Promise((resolve, reject) => {
      uv.onloadedmetadata = resolve;
      uv.onerror = () => reject(new Error('video decode failed'));
    });
    // Nudge iOS into decoding frames before we start seeking
    try { await uv.play(); } catch (e) {}
    uv.pause();
    if (!isFinite(uv.duration) || uv.duration <= 0) throw new Error('unknown video duration');
    if (uv.duration > MAX_UPLOAD_S) { errorKey = 'uploadTooLong'; throw new Error('video too long'); }

    await ensurePoseEngine();
    const samples = await analyzeUploadedVideo(uv);

    if (!uploadCancelled) {
      card = finalizeTechnique();
      $('technique-result-overlay').classList.remove('show');
      setUploadStage('uploadRendering');
      try {
        lastVideo = await renderUploadedVideo(uv, samples, card);
      } catch (err) {
        console.error(err);
        errorKey = err.message === 'interrupted' ? 'uploadInterrupted' : 'uploadRenderFailed';
      }
    }
  } catch (err) {
    console.error(err);
    errorKey = errorKey || 'uploadFailed';
  }

  uploadActive = false;
  lmFilters = null;
  uv.pause();
  uv.removeAttribute('src');
  uv.load();
  URL.revokeObjectURL(url);
  if (wakeLock) wakeLock.release().catch(() => {});
  $('upload-overlay').classList.remove('show');

  if (uploadCancelled) { lastVideo = null; showOverlayScreen('mode-screen'); return; }
  finalizeTechnique();
  if (errorKey) $('tech-res-tip').textContent = t(errorKey);
}

// ===================== RECORDING =====================
const recCanvas = document.createElement('canvas');
recCanvas.width = 1080;
recCanvas.height = 1920;
const recCtx = recCanvas.getContext('2d');
const REC_CARD_MS = 2500;
const APP_URL_LABEL = 'errikko.github.io/handstand-fighter';

let mediaRecorder = null;          // live recording
let recState = 'idle';             // idle | recording | finishing | ready
let recCard = null;                // { data, startedAt } while the result card is appended
let lastVideo = null;              // File of the most recent finished recording

const PILL_STYLES = {
  'pill-waiting':   { bg: 'rgba(40,40,60,0.85)', color: '#888888', border: '#333333' },
  'pill-detecting': { bg: 'rgba(10,40,10,0.85)', color: '#4caf50', border: '#4caf5066' },
  'pill-handstand': { bg: 'rgba(60,40,0,0.85)',  color: '#f0c040', border: '#f0c04066' },
  'pill-active':    { bg: 'rgba(40,0,80,0.85)',  color: '#c080ff', border: '#c080ff66' },
};

function pickMimeType() {
  if (typeof MediaRecorder === 'undefined') return '';
  return ['video/mp4', 'video/webm;codecs=h264', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
}

function createRecorder(onDone) {
  const stream = recCanvas.captureStream(30);
  const mimeType = pickMimeType();
  const options = { videoBitsPerSecond: 10_000_000 };
  if (mimeType) options.mimeType = mimeType;
  const rec = new MediaRecorder(stream, options);
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(tr => tr.stop());
    const type = rec.mimeType || mimeType || 'video/mp4';
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    onDone(new File(chunks, `handstand-fighter-${Date.now()}.${ext}`, { type }));
  };
  return rec;
}

// Size factor between the phone screen layout (CSS px) and the 1080px-wide recording
function recScale() { return recCanvas.width / window.innerWidth; }

function toggleRecording() {
  if (recState === 'recording') stopLiveRecording(null);
  else if (recState === 'ready') shareLastVideo();
  else if (recState === 'idle') startLiveRecording();
}

function startLiveRecording() {
  lastVideo = null;
  recCard = null;
  mediaRecorder = createRecorder(file => {
    lastVideo = file;
    mediaRecorder = null;
    recCard = null;
    setRecState('ready');
  });
  mediaRecorder.start(1000);
  setRecState('recording');
}

// cardData: append a result card before stopping; null stops right away
function stopLiveRecording(cardData) {
  if (recState !== 'recording' || !mediaRecorder) return;
  setRecState('finishing');
  if (!cardData) { mediaRecorder.stop(); return; }
  recCard = { data: cardData, startedAt: performance.now() };
  const rec = mediaRecorder;
  setTimeout(() => { if (rec.state === 'recording') rec.stop(); }, REC_CARD_MS);
}

function setRecState(state) {
  recState = state;
  const btn = $('rec-btn');
  btn.classList.toggle('recording', state === 'recording');
  btn.classList.toggle('ready', state === 'ready');
  $('rec-label').textContent = { idle: 'REC', recording: 'STOP', finishing: '...', ready: 'SAVE' }[state];
  updateSaveButtons();
}

function updateSaveButtons() {
  const preparing = recState === 'finishing';
  ['tech-res-save-btn', 'result-save-btn'].forEach(id => {
    const btn = $(id);
    btn.hidden = !lastVideo && !preparing;
    btn.disabled = preparing || !lastVideo;
    btn.textContent = preparing ? t('savePreparing') : t('saveVideo');
  });
}

// Share sheet lets iOS save straight to Photos or post to Instagram; falls back to a download
async function shareLastVideo() {
  if (!lastVideo) return;
  if (navigator.canShare && navigator.canShare({ files: [lastVideo] })) {
    try {
      await navigator.share({ files: [lastVideo] });
      if (recState === 'ready') setRecState('idle');
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.error(err);
    }
  }
  const url = URL.createObjectURL(lastVideo);
  const a = document.createElement('a');
  a.href = url;
  a.download = lastVideo.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  if (recState === 'ready') setRecState('idle');
}

function recRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function recCover(vw, vh) {
  const s = Math.max(recCanvas.width / vw, recCanvas.height / vh);
  return { s, dx: (recCanvas.width - vw * s) / 2, dy: (recCanvas.height - vh * s) / 2 };
}

function drawVideoCover(c, v, mirrored) {
  const vw = v.videoWidth || 1280, vh = v.videoHeight || 720;
  const { s, dx, dy } = recCover(vw, vh);
  c.save();
  if (mirrored) { c.translate(recCanvas.width, 0); c.scale(-1, 1); }
  c.drawImage(v, dx, dy, vw * s, vh * s);
  c.restore();
}

function dimRec() {
  recCtx.fillStyle = 'rgba(0,0,0,0.3)';
  recCtx.fillRect(0, 0, recCanvas.width, recCanvas.height);
}

// Skeleton mapped through the recording's own cover crop, so it stays on the body
function drawSkeletonOnRec(lm, vw, vh, mirrored, k, showAngle) {
  const { s, dx, dy } = recCover(vw, vh);
  const px = i => { const x = lm[i].x * s + dx; return mirrored ? recCanvas.width - x : x; };
  const py = i => lm[i].y * s + dy;
  drawSkeleton(recCtx, lm, px, py, k);
  if (showAngle && angleLabel) {
    recCtx.font = `bold ${Math.round(20 * k)}px Inter`;
    recCtx.fillStyle = angleLabel.color;
    recCtx.fillText(angleLabel.value + '°', px(13) + 8 * k, py(13));
  }
}

function liveHudData() {
  const pillCls = [...statusPill.classList].find(c => c.startsWith('pill-'));
  const stats = $('hud-bottom').style.display === 'none' ? null : [
    { val: $('stat-record').textContent, lbl: $('stat-record-lbl').textContent },
    { val: $('stat-points').textContent, lbl: $('stat-points-lbl').textContent },
    { val: $('stat-rank').textContent,   lbl: $('stat-rank-lbl').textContent },
  ];
  return {
    label: sessionModeLabelEl.textContent,
    value: sessionValueEl.textContent,
    unit: $('session-unit').textContent,
    pill: { text: statusPill.textContent.trim(), cls: pillCls },
    stats,
  };
}

// Mirrors the on-screen HUD layout (56px top, 28px sides, 72px bottom) at recording scale
function drawHud(c, hud, k) {
  const W = recCanvas.width, H = recCanvas.height;
  const padTop = 56 * k, padSide = 28 * k, padBot = 72 * k;
  c.save();

  const cardPadX = 12 * k, cardPadY = 7 * k;
  const labelSize = Math.round(9 * k), valSize = Math.round(22 * k), unitSize = Math.round(11 * k);
  const rowGap = 3 * k;
  c.font = `${labelSize}px 'Press Start 2P', monospace`;
  const labelW = c.measureText(hud.label).width;
  c.font = `${valSize}px 'Press Start 2P', monospace`;
  const valW = c.measureText(hud.value).width;
  c.font = `${unitSize}px Inter, sans-serif`;
  const unitW = hud.unit ? c.measureText(hud.unit).width + 7 * k : 0;

  const cardW = Math.max(labelW, valW + unitW) + cardPadX * 2;
  const cardH = cardPadY + labelSize + rowGap + valSize + cardPadY;
  const cardX = padSide, cardY = padTop;
  c.fillStyle = 'rgba(0,0,0,0.65)';
  recRoundRect(c, cardX, cardY, cardW, cardH, 10 * k);
  c.fill();
  c.strokeStyle = '#c080ff44';
  c.lineWidth = Math.max(1, k);
  c.stroke();

  c.font = `${labelSize}px 'Press Start 2P', monospace`;
  c.fillStyle = '#c080ff';
  c.fillText(hud.label, cardX + cardPadX, cardY + cardPadY + labelSize);

  const valY = cardY + cardPadY + labelSize + rowGap + valSize;
  c.font = `${valSize}px 'Press Start 2P', monospace`;
  c.fillStyle = '#ffffff';
  c.shadowColor = '#c080ff88';
  c.shadowBlur = 16 * k;
  c.fillText(hud.value, cardX + cardPadX, valY);
  c.shadowBlur = 0;
  if (hud.unit) {
    c.font = `${unitSize}px Inter, sans-serif`;
    c.fillStyle = '#888888';
    c.fillText(hud.unit, cardX + cardPadX + valW + 7 * k, valY);
  }

  if (hud.pill && hud.pill.text) {
    const st = PILL_STYLES[hud.pill.cls] || PILL_STYLES['pill-waiting'];
    const pillSize = Math.round(10 * k);
    c.font = `bold ${pillSize}px Inter, sans-serif`;
    const pillPX = 12 * k, pillPY = 5 * k;
    const pillW = c.measureText(hud.pill.text).width + pillPX * 2;
    const pillH = pillSize + pillPY * 2;
    const pillY = cardY + cardH + 8 * k;
    c.fillStyle = st.bg;
    recRoundRect(c, padSide, pillY, pillW, pillH, pillH / 2);
    c.fill();
    c.strokeStyle = st.border;
    c.stroke();
    c.fillStyle = st.color;
    c.fillText(hud.pill.text, padSide + pillPX, pillY + pillPY + pillSize * 0.85);
  }

  if (hud.stats) {
    const statValSize = Math.round(11 * k), statLblSize = Math.round(8 * k);
    const statPadY = 6 * k, statGap = 8 * k;
    const statCardW = (W - padSide * 2 - statGap * 2) / 3;
    const statCardH = statPadY + statValSize + 6 * k + statLblSize + statPadY;
    const statY = H - padBot - statCardH;
    hud.stats.forEach((item, i) => {
      const x = padSide + i * (statCardW + statGap);
      c.fillStyle = 'rgba(0,0,0,0.65)';
      recRoundRect(c, x, statY, statCardW, statCardH, 8 * k);
      c.fill();
      c.strokeStyle = '#ffffff15';
      c.stroke();
      c.font = `${statValSize}px 'Press Start 2P', monospace`;
      c.fillStyle = '#c080ff';
      c.fillText(item.val, x + (statCardW - c.measureText(item.val).width) / 2, statY + statPadY + statValSize);
      c.font = `${statLblSize}px 'Press Start 2P', monospace`;
      c.fillStyle = '#888888';
      c.fillText(item.lbl, x + (statCardW - c.measureText(item.lbl).width) / 2, statY + statPadY + statValSize + 6 * k + statLblSize);
    });
  }
  c.restore();
}

function fillTextCentered(c, text, y, maxW, lineH) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  lines.forEach((l, i) => c.fillText(l, recCanvas.width / 2, y + i * lineH));
}

// Closing card appended to recordings: mode, score and where to get the app
function drawResultCard(c, d, alpha) {
  const W = recCanvas.width, H = recCanvas.height;
  c.save();
  c.fillStyle = `rgba(10,10,15,${0.88 * alpha})`;
  c.fillRect(0, 0, W, H);
  c.globalAlpha = alpha;
  c.textAlign = 'center';

  c.font = `44px 'Press Start 2P', monospace`;
  c.fillStyle = '#f0c040';
  c.shadowColor = '#f0c04088';
  c.shadowBlur = 30;
  c.fillText('HANDSTAND FIGHTER', W / 2, 560);
  c.shadowBlur = 0;

  c.font = `36px 'Press Start 2P', monospace`;
  c.fillStyle = '#c080ff';
  c.fillText(d.label, W / 2, 780);

  c.font = `${d.big.length > 4 ? 150 : 190}px 'Press Start 2P', monospace`;
  c.fillStyle = '#ffffff';
  c.shadowColor = '#c080ff';
  c.shadowBlur = 50;
  c.fillText(d.big, W / 2, 1050);
  c.shadowBlur = 0;

  let y = 1160;
  if (d.unit) {
    c.font = `600 44px Inter, sans-serif`;
    c.fillStyle = '#aaaaaa';
    c.fillText(d.unit, W / 2, y);
    y += 90;
  }
  if (d.sub) {
    c.font = `40px 'Press Start 2P', monospace`;
    c.fillStyle = '#f0c040';
    c.fillText(d.sub, W / 2, y);
    y += 90;
  }
  if (d.line) {
    c.font = `600 42px Inter, sans-serif`;
    c.fillStyle = '#dddddd';
    fillTextCentered(c, d.line, y, 860, 56);
  }

  c.font = `600 34px Inter, sans-serif`;
  c.fillStyle = '#888888';
  const code = profile && profile.refCode;
  c.fillText(code ? `${APP_URL_LABEL}/?ref=${code}` : APP_URL_LABEL, W / 2, 1640);
  c.restore();
}

// Called each frame from renderLoop while a live recording is running
function drawRecFrame(image) {
  if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
  const k = recScale();
  drawVideoCover(recCtx, image, isMirrored);
  dimRec();
  if (latestLm) drawSkeletonOnRec(latestLm, image.videoWidth, image.videoHeight, isMirrored, k, true);
  if (recCard) {
    drawResultCard(recCtx, recCard.data, Math.min(1, (performance.now() - recCard.startedAt) / 300));
    return;
  }
  drawHud(recCtx, liveHudData(), k);
}

// ===================== BOOT =====================
async function boot() {
  applyLanguage(LANG);
  captureReferral();
  showOverlayScreen('boot-screen');

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session && (!authUser || authUser.id !== session.user.id)) onSignedIn(session.user);
    if (event === 'SIGNED_OUT' && authUser) { authUser = null; profile = null; showLoginForm(); }
  });

  const { data: { session } } = await sb.auth.getSession();
  if (authErrorInUrl) history.replaceState(null, '', location.pathname + location.search);
  if (session) {
    if (!authUser) onSignedIn(session.user);
  } else {
    showLoginForm(authErrorInUrl ? 'loginLinkExpired' : null);
  }
}
boot();
</script>
